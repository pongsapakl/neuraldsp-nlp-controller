[project]
name = "neuraldsp-nlp-controller"
version = "0.1.0"
description = "NLP-controlled tone engine for Neural DSP Archetype plugins"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pedalboard",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.3.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neuraldsp_nlp_controller"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "librosa>=0.11.0",
    "matplotlib>=3.10.8",
    "scikit-learn>=1.8.0",
    "soundfile>=0.13.1",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "transformers>=5.5.0",
]
