[project]
name = "neuraldsp-nlp-controller"
version = "0.1.0"
description = "NLP-controlled tone engine for Neural DSP Archetype plugins"
requires-python = ">=3.11"
dependencies = [
    "gradio>=6.11.0",
    "pedalboard",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neuraldsp_nlp_controller"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
